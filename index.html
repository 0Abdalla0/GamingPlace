<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/all.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <title>Home</title>
</head>
<body class="bg_color">
    <header>
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="homeIcon">Gaming Place</a>
                <nav>
                    <ul id="links">
                        <li><a href="signIn.html">Sign In</a></li>
                        <li><a href="signUp.html">Sign Up</a></li>
                    </ul>
                    <ul id="user-info">
                        <li><a href="#" id="user"></a></li>
                        <li class="shopping_cart">
                            <i class="fas fa-shopping-cart"></i>
                            <span class="badge"></span>
                            <div class="carts_products">
                                <div></div>
                                <a href="cartsproducts.html">View Products</a>
                            </div>
                        </li>
                        <li><a href="#" id="logout">Log Out</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>


<section class="home">
    <div class="container">
        <div class="products row">

            <div class="product_item col-xl-3" data-id="1">

                <img src="images/gamingChair.png" alt="gamingChair">

                <div class="product_item_desc">

                    <!-- PRODUCT NAME -->
                    <p class="product_name" data-name="Gaming Chair">
                        Product: Gaming Chair
                    </p>

                    <!-- PRICE -->
                    <p class="product_price" data-price="280">
                        Price: 280$
                    </p>

                    <!-- AVAILABILITY -->
                    <p class="product_status in-stock" data-status="In Stock">
                        In Stock
                    </p>

                    <!-- CATEGORY -->
                    <p class="product_category">
                        Category: Furniture
                    </p>

                </div>

                <div class="product_item_action">
                    <button class="add_to_cart btn">Add To Cart</button>
                    <button class="remove_from_cart">Remove From Cart</button>
                </div>

                <i class="fa-solid fa-heart fav" style="color: white;"></i>

            </div>

        </div>
    </div>
</section>

    <script src="js/script.js"></script>

<!-- /////////////////////////////////////////////////////////////////////////////////////////////////////////////////// -->

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <!-- Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
